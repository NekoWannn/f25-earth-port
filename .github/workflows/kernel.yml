name: kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bc libssl-dev bison flex zip binutils-aarch64-linux-gnu

      - name: AOSP clang r416183b (matches vendor build banner)
        run: |
          for i in 1 2 3; do
            curl -fL --retry 8 --retry-delay 5 --retry-all-errors \
                 -o clang.tgz \
                 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android12-release/clang-r416183b.tar.gz" \
              && file clang.tgz | grep -q gzip && break
            echo "retry $i: bad download"; rm -f clang.tgz; sleep 10
          done
          file clang.tgz
          mkdir -p toolchain
          tar -xz -f clang.tgz -C toolchain
          ./toolchain/bin/clang --version

      - name: Kernel source (earth-s-oss, 4.19.191)
        run: |
          curl -sSL -o kernel.tgz "https://codeload.github.com/MiCode/Xiaomi_Kernel_OpenSource/tar.gz/refs/heads/earth-s-oss"
          mkdir -p src
          tar -xzf kernel.tgz -C src --strip-components=1
          head -4 src/Makefile

      - name: Apply local patches
        run: |
          shopt -s nullglob
          for p in patches/*.patch; do
            echo "== applying $p"
            patch -p1 -d src < "$p"
          done

      - name: Baseline build (earth_defconfig)
        run: |
          export PATH="$PWD/toolchain/bin:$PATH"
          cd src
          make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- earth_defconfig
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- Image.gz
          make -j"$(nproc)" O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- \
               CROSS_COMPILE=aarch64-linux-gnu- dtbs

      - name: Board dtb (k69v1_64_k419 is not in dtb-y)
        run: |
          cd src
          gcc -E -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I arch/arm64/boot/dts -I arch/arm64/boot/dts/mediatek \
              -I include -I arch/arm64/include \
              -o out/k69v1_64_k419.dts.tmp \
              arch/arm64/boot/dts/mediatek/k69v1_64_k419.dts
          out/scripts/dtc/dtc -O dtb -o out/k69v1_64_k419.dtb out/k69v1_64_k419.dts.tmp
          ls -l out/k69v1_64_k419.dtb

      - name: Report
        run: |
          ls -l src/out/arch/arm64/boot/
          gzip -l src/out/arch/arm64/boot/Image.gz || true

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-out
          path: |
            src/out/arch/arm64/boot/Image.gz
            src/out/arch/arm64/boot/Image
            src/out/k69v1_64_k419.dtb
            src/.config
          if-no-files-found: warn
